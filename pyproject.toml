[project]
name = "faqbot"
version = "0.1.0"
description = "A student FAQ chatbot with a web UI, terminal mode, and SQLite storage"
readme = "README.md"
authors = [
    { name = "Ravencentric", email = "78981416+Ravencentric@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
faqbot = "faqbot.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"
preset = "strict"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
